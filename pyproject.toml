[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vex-aim-mcp"
version = "0.1.0"
description = "Drive, see through and play soccer with a VEX AIM robot from Claude: an MCP server, a live control panel and simulators."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Budd" }]
requires-python = ">=3.11"
keywords = ["vex", "vex-aim", "robotics", "mcp", "claude", "education", "soccer"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mcp>=2.3,<3",
  "pydantic>=2.12",
  "websockets>=15",
  "pillow>=10.1",
]

[project.optional-dependencies]
# A second opinion from a bigger object detector, run on this computer (a large download: PyTorch)
yolo = ["ultralytics>=8.4"]

[project.scripts]
vex-aim-mcp = "vex_aim_mcp.server:main"      # the MCP server Claude starts
vex-aim-panel = "vex_aim_mcp.panel:main"     # the control panel on its own, without Claude
vex-aim-sim = "vex_aim_mcp.mock_robot:main"  # a simulated robot, to try things without one
vex-aim-arena = "vex_aim_mcp.mock_arena:main"  # several simulated robots on one pitch

[project.urls]
Homepage = "https://github.com/dbbudd/VEX-AIM-MCP"
Issues = "https://github.com/dbbudd/VEX-AIM-MCP/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vex_aim_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "AGENTS.md", "CLAUDE.md", "LICENSE", "pyproject.toml"]
